# Reference deployment (DESIGN §3, README.md "Running with Docker").
#
# Before the first `docker compose up`:
#
#   1. mkdir -p data && chown 10001:10001 data
#      (10001:10001 is the image's built-in `tgabbr` user — see Dockerfile.
#      Skipping this is THE classic failure: the container starts, SQLite
#      tries to create the .db file on the bind mount, and it cannot because
#      the host directory is owned by someone else. See README.md.)
#   2. cp config.example.yaml config.yaml && edit it
#      (at minimum: bot.operatorContact, telegram.allowlist)
#   3. cp .env.example .env && fill in BOT_TOKEN and ANTHROPIC_API_KEY
#
# Then: docker compose up -d
#
# Scaling this to more than one `app` replica is never correct — Telegram
# allows exactly one long-poller per bot token (DESIGN §3, §9); the known
# scaling path is 1 ingester + N workers + Postgres + a queue, not more
# containers of this image.
services:
  app:
    build:
      context: .
      args:
        # Baked in at build time so every reported error carries the exact
        # revision that produced it (DESIGN §11). scripts/release-sha.sh
        # computes this the same way in CI.
        RELEASE: ${RELEASE:-unknown}
    image: tg-abreviator:local
    container_name: tg-abreviator
    restart: unless-stopped
    # Reaps the long-polling process cleanly on SIGTERM instead of the
    # container needing to kill -9 after the compose stop grace period.
    init: true

    # Must match the ownership of ./data on the host (see step 1 above), or
    # SQLite cannot create/open the database file. Overridable per host, but
    # the two numbers must move together.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"

    env_file:
      # Secrets and per-deployment values — never committed (see .gitignore
      # and .dockerignore). Copy .env.example to get started.
      - path: .env
        required: false
    environment:
      # DESIGN §10 layer 3. Only the non-secret, deployment-shape ones are
      # listed explicitly here; secrets (BOT_TOKEN, ANTHROPIC_API_KEY,
      # GLITCHTIP_DSN) belong in .env, not in this file, so this file stays
      # safe to commit.
      DATABASE_PATH: /app/data/tg-abreviator.db
      DATABASE_LOCK_PATH: /app/data/tg-abreviator.lock
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      RELEASE: ${RELEASE:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # Host bind mount, deliberately not a named volume (DESIGN §3): WAL
      # mode needs a real local filesystem — a named volume can silently be
      # backed by one that isn't, and it must NEVER be NFS.
      - ./data:/app/data
      # config.yaml is a deployment artifact (edit + restart, DESIGN §10),
      # not something baked into the image.
      - ./config.yaml:/app/config.yaml:ro

    # No ports: this is a long-polling process (DESIGN §3), it opens no
    # inbound listener.

    stop_grace_period: 30s
