# tg-abreviator — configuration reference (DESIGN §10).
#
# This file is layer 2 of four:
#
#   1. defaults  built into the release (src/config/defaults.ts)   changed by: a release
#   2. file      this file                                          changed by: edit + restart
#   3. env       secrets and deployment paths                       changed by: redeploy
#   4. chat      per-chat tz / model, from SQLite                   changed by: bot commands, live
#
# Everything below has a default, so a real config.yaml can be five lines:
#
#     bot:
#       operatorContact: "@yourhandle"
#     telegram:
#       allowlist: [-1001234567890]
#
# There is **no hot reload**: edit and restart. Chat settings are live precisely
# because they are a database-backed layer instead.
#
# Secrets are never in this file — it is in git. They live in the env layer and
# are referenced by *name* (`apiKeyEnv: ANTHROPIC_API_KEY`). Putting `telegram.token`,
# `telegram.operatorUserIds` or `observability.dsn` here is a validation error,
# not a warning.
#
# Reserved by config-layers: no key may be named `__inspect`, `__derive`, `get`
# or `getAll`. Validation rejects them.
#
# Environment variables (layer 3):
#   BOT_TOKEN            required. From BotFather.
#   ANTHROPIC_API_KEY    required if any registry entry names it in apiKeyEnv.
#   DATABASE_PATH        overrides database.path.
#   DATABASE_LOCK_PATH   overrides database.lockPath.
#   OPERATOR_USER_IDS    comma-separated Telegram user ids. Tier `operator`.
#   TTL_HARD_CAP_DAYS    overrides retention.hardCapDays. The ceiling nothing can exceed.
#   GLITCHTIP_DSN        unset selects the no-op error reporter.
#   ENVIRONMENT          dev | preprod | prod | test.
#   RELEASE              git SHA, tagged on every reported event.
#   LOG_LEVEL            trace | debug | info | warn | error | fatal.

bot:
  # The only trigger. Nothing else in the chat ever invokes the bot: it sees
  # every message, so implicit triggering would fire on ordinary conversation.
  # 1-32 characters of [a-z0-9_], without the leading slash.
  commandName: tldr

  # Language of the bot's own strings — header, footer, error replies. pl | en.
  language: pl

  # Shown by /privacy and in the join announcement. Data export requests are
  # handled manually by whoever is named here, so name someone real.
  operatorContact: ""

  # Announce on joining a group, carrying the operator contact and what is
  # stored. The bot builds a durable transcript of a chat that believes itself
  # ephemeral; saying so out loud is part of the deal.
  announceOnJoin: true

telegram:
  # THE single biggest risk reducer (DESIGN §5). Any chat not listed here gets
  # "not authorised", then leaveChat, and **nothing is stored**. Negative ids
  # are groups and supergroups. An empty allowlist fails validation, because a
  # bot that refuses every chat is never what anyone meant.
  allowlist: []

  # Long-poll timeout in seconds, 1-50. Webhooks are not used: no public URL, no
  # TLS termination, and the persisted offset is crash recovery for free.
  pollTimeoutSeconds: 30

  # `message` is required or there is no corpus. `callback_query` is required or
  # the 👍/👎 keyboard spins forever on the client.
  allowedUpdates:
    - message
    - edited_message
    - callback_query
    - my_chat_member

database:
  # SQLite file. In Docker this must be a **host bind mount**, not a named
  # volume, with `user:` set in compose and the directory pre-created — uid/gid
  # mismatch is the classic failure. Never NFS: WAL over NFS corrupts.
  path: ./data/tg-abreviator.db

  # PRAGMA busy_timeout, in milliseconds.
  busyTimeoutMs: 5000

  # Single-instance lockfile. Two processes polling one token get 409 Conflict
  # from Telegram, so a second instance must exit loudly rather than compete.
  lockPath: ./data/tg-abreviator.lock

retention:
  # Rolling TTL in days. The deletion story *is* the TTL: Telegram sends no
  # "message deleted" update, so there is nothing else to react to.
  ttlDays: 30

  # Per-chat overrides, keyed by chat id as a string. Operator-only: a group
  # admin extending retention would be doing it to other people's messages.
  perChatTtlDays: {}
  #  "-1001234567890": 7

  # Ceiling for every value above. Overridden by TTL_HARD_CAP_DAYS. Nothing can
  # set "forever" without a redeploy.
  hardCapDays: 90

  # How often the TTL sweeper runs. It deletes expired messages, expired
  # usage_events, expired pseudonyms, and chunks whose newest covered message
  # has expired.
  sweepIntervalMinutes: 60

  # On startup, if now - poll_state.last_seen_at exceeds this, insert a
  # gap_marker row. Any range overlapping a gap gets an explicit line in the
  # output: silent holes destroy trust faster than missing features.
  gapThresholdMinutes: 15

timezone:
  # Fallback IANA zone for chats that have not run `/tldr tz <IANA>`.
  # Range arithmetic is DST-correct: a 3d range across the October change is 73
  # hours, and the 6h compaction buckets are cut in this zone.
  default: Europe/Warsaw

models:
  # Registry alias used when no routing rule matches. Chat admins can override
  # it per chat with `/tldr model <alias>` (that is configuration layer 4).
  default: sonnet

  # alias -> provider entry. `apiKeyEnv` is the *name* of an environment
  # variable, never a key: this repo is public.
  registry:
    sonnet:
      provider: anthropic
      model: claude-sonnet-5
      apiKeyEnv: ANTHROPIC_API_KEY
      maxOutputTokens: 4096
    haiku:
      provider: anthropic
      model: claude-haiku-4-5
      apiKeyEnv: ANTHROPIC_API_KEY
      maxOutputTokens: 4096

  # Ordered rules, first match wins, falling through to `default`. A small rule
  # list, not a DSL. The map phase on a cheap model and the reduce phase on the
  # strong one is the actual point of having more than one model here.
  #
  # `when` supports: phase (single | map | reduce), chatId, minInputTokens.
  routing:
    - when: { phase: map }
      use: haiku

  # $ per million tokens, keyed by **concrete model id** (not alias). Stored on
  # every usage row as it was at the time of the call, so editing this table
  # never rewrites last month's history. Hardcoding prices in code makes the
  # stats worthless the day prices change.
  prices:
    claude-sonnet-5:
      inputPerMTokUsd: 3
      outputPerMTokUsd: 15
      cacheReadPerMTokUsd: 0.3
    claude-haiku-4-5:
      inputPerMTokUsd: 1
      outputPerMTokUsd: 5
      cacheReadPerMTokUsd: 0.1

prompts:
  # Bump this whenever a prompt changes. It is part of every chunk cache key —
  # otherwise you serve summaries from a prompt you have since fixed — part of
  # the dedupe key, and a tag on every reported error.
  version: v1

limits:
  # Checked with the provider's count_tokens before every call. One
  # 10,000-character message can blow a 500-message budget by itself, so this is
  # never estimated.
  maxInputTokens: 150000

  # THE compaction threshold — one value, applied recursively at every level.
  # Concatenate; if over this, split and summarize each part; repeat on the
  # results. Not two thresholds: compaction is roughly 20:1, so a second higher
  # threshold for the recursion step would be unreachable dead code.
  # This is a cost and attention knob, not a context-window constraint.
  compactThreshold: 60000

  # Hard cap on messages per range. 500 is also the ceiling in code; this knob
  # can only lower it.
  maxMessagesPerRange: 500

  # Range when the user gives none: the last N days, capped by maxMessagesPerRange.
  defaultRangeDays: 2

  # The reduce step is instructed to stay under this many characters. Splitting
  # is a safety net, not the normal path.
  maxOutputChars: 3000

  # Maximum parts when a reply must be split. Splits land on paragraph
  # boundaries and never inside an HTML tag. 1-3.
  maxOutputParts: 3

guards:
  # Per-user cooldown in seconds; the refusal states the remaining time.
  cooldownSeconds: 60

  # In-flight requests per chat. Also what stops two map-reduce jobs racing on
  # the same chunks. Leave at 1.
  concurrentPerChat: 1

  # An identical request within this window returns the previous answer, marked
  # as cached. Exact match on a normalized question, deliberately: a false
  # positive is a silently wrong answer, a false negative costs about $0.08.
  dedupeTtlSeconds: 300

  # Per-chat daily call cap.
  dailyCallsPerChat: 50

  # Global daily spend cap in USD, across every chat. When it trips the bot
  # refuses everything until midnight. This is the only control that bounds
  # actual liability — a hard stop, not a warning. 0 disables the bot entirely.
  globalDailyBudgetUsd: 5

delivery:
  # Minimum milliseconds between edits of the progress placeholder. Edits count
  # against the same ~20/min per-group budget as sends.
  editThrottleMs: 3000

  # Link previews. Expected to stay false: model output is untrusted text and a
  # preview fetches whatever it names.
  linkPreview: false

  # Default delivery for users who have never run `/tldr dm on|off`. In-chat is
  # the default because transparency is a feature: everyone can see what the bot
  # claimed and correct it.
  dmByDefault: false

safety:
  # Substitution applied to *rendered output*, per language — a regex, not a
  # prompt rule, so it is testable. The model separately reports tone, so a
  # heated exchange still gets a ⚠️ in the header: baby-talk the words, keep the
  # temperature honest. Add a language code and the list is picked up.
  slurs:
    pl: []
    en: []

  redaction:
    # API-key / token / IBAN / card / long-digit shapes are stored as
    # [redacted] at ingest. The database should not hold them either.
    enabled: true

    # Extra shapes beyond the built-ins, as JavaScript regex sources.
    extraPatterns: []
    #  - name: internal-ticket
    #    pattern: "ACME-[0-9]{6}"

observability:
  # dev | preprod | prod | test. Tagged on every reported event, alongside the
  # release SHA and the prompt version.
  environment: dev

  # The DSN itself is env-only (GLITCHTIP_DSN); unset selects a no-op reporter,
  # so a contributor without one still gets a working bot and tests never emit.
  #
  # Set the GlitchTip project's event retention no longer than retention.ttlDays:
  # error events carry a pseudonymous identifier, and /forgetme cannot reach a
  # copy that has already left the building.

logging:
  level: info

  # Never log row contents. Kept as an explicit, auditable knob rather than an
  # unwritten rule — and it is `false`, permanently: console breadcrumbs will
  # cheerfully capture the transcript you logged three lines earlier.
  logMessageContents: false
