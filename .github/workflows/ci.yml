name: CI

on:
  push:
    branches: [main]
  pull_request:

# A stray second workflow run for the same ref cannot do anything useful.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint (incl. import boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Proves the eslint-plugin-boundaries rules actually fire, against a
      # deliberately-failing fixture excluded from the run above
      # (DESIGN §3, eslint-fixtures/README.md).
      - run: npm run lint:boundaries-fixture

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/release-sha.sh reads history to detect a dirty tree;
          # depth 0 also lets it resolve HEAD on a shallow-unfriendly runner.
          fetch-depth: 0
      # docker compose v2 and the docker CLI are preinstalled on the
      # ubuntu-latest runner image; no setup action needed.
      - run: scripts/docker-smoke-test.sh
